name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Test Rust Core, Engine, & JNI crates
        run: |
          cargo test -p gridcraft-core -p gridcraft-numfmt -p gridcraft-formula \
            -p gridcraft-functions -p gridcraft-model -p gridcraft-calc \
            -p gridcraft-xlsx -p gridcraft-chart -p gridcraft-engine -p masusheet-jni

      - name: Build Host JNI Library for Android Unit Tests
        run: cargo build --manifest-path crates/jni/Cargo.toml --release

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Run Android Unit Tests, Lint, & Debug APK Build
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
