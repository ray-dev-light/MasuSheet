# Modified in 2026 for MasuSheet (Android spreadsheet fork of GridCraft).
# [EN] Workspace Cargo manifest for the MasuSheet Rust calculation engine and Android JNI bridge.
# [JA] MasuSheet の Rust 製表計算エンジンおよび Android JNI ブリッジ用ワークスペース定義です。
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.14.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/ray-dev-light/MasuSheet"

[workspace.dependencies]
# internal calculation & serialization crates
gridcraft-core = { path = "crates/core" }
gridcraft-numfmt = { path = "crates/numfmt" }
gridcraft-formula = { path = "crates/formula" }
gridcraft-functions = { path = "crates/functions" }
gridcraft-model = { path = "crates/model" }
gridcraft-calc = { path = "crates/calc" }
gridcraft-xlsx = { path = "crates/xlsx" }
gridcraft-chart = { path = "crates/chart" }
gridcraft-engine = { path = "crates/engine" }
gridcraft-pdf = { path = "crates/pdf" }

# foundation (100% permissive crates.io dependencies — zero external git patches)
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
web-time = "1.1.0"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
quick-xml = "0.41"
zip = { version = "3", default-features = false, features = ["deflate"] }
sha2 = { version = "0.11", default-features = false }
aes = { version = "0.9", default-features = false }
sha1 = { version = "0.11", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
strip = "symbols"
